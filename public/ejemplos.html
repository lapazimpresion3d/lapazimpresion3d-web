<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ejemplos de llaveros · Lapazimpresion3d</title>
  <link rel="stylesheet" href="css/ejemplos.css">
</head>
<body>
  <header>
    <h1>Ejemplos de llaveros personalizados</h1>
    <p>Lapazimpresion3d · La Paz, BCS</p>
  </header>
  <main class="wrap">
    <a class="volver" href="index.html">← Volver al inicio</a>
    <p class="nota">Ejemplos ilustrativos de diseños. Cada llavero puede personalizarse.</p>

    <section>
      <h2>Diseños desde fotografías</h2>
      <div class="grid">
        <figure class="item">
          <img src="images/mascotas.webp"
                 srcset="images/mascotas-192.webp 192w, images/mascotas-320.webp 320w, images/mascotas.webp 518w"
                 sizes="(max-width: 360px) calc(100vw - 32px), (max-width: 850px) calc((100vw - 48px) / 2), 401px" width="518" height="356" alt="Ejemplo de llavero personalizado: Mascotas" loading="lazy">
          <figcaption>Mascotas</figcaption>
        </figure>
        <figure class="item">
          <img src="images/fotografia_1.webp"
                 srcset="images/fotografia_1-192.webp 192w, images/fotografia_1-320.webp 320w, images/fotografia_1.webp 488w"
                 sizes="(max-width: 360px) calc(100vw - 32px), (max-width: 850px) calc((100vw - 48px) / 2), 401px" width="488" height="356" alt="Ejemplo de llavero personalizado: Diseños desde fotografías" loading="lazy">
          <figcaption>Personas</figcaption>
        </figure>
        <figure class="item">
          <img src="images/vehiculos.webp" alt="Vehículos" loading="lazy">
          <figcaption>Vehículos</figcaption>
        </figure>
        <figure class="item">
          <img src="images/embarcaciones.webp" alt="Embarcaciones" loading="lazy">
          <figcaption>Embarcaciones</figcaption>
        </figure>
        <figure class="item">
          <img src="images/fauna_naturaleza.webp" alt="Fauna y naturaleza" loading="lazy">
          <figcaption>Fauna y naturaleza</figcaption>
        </figure>
        <figure class="item">
          <img src="images/lugares_recuerdos.webp" alt="Lugares y recuerdos" loading="lazy">
          <figcaption>Lugares y recuerdos</figcaption>
        </figure>
      </div>
    </section>

    <section>
      <h2>Celebraciones y eventos</h2>
      <div class="grid">
        <figure class="item">
          <img src="images/celebracion_1.webp"
                 srcset="images/celebracion_1-192.webp 192w, images/celebracion_1-320.webp 320w, images/celebracion_1.webp 512w"
                 sizes="(max-width: 360px) calc(100vw - 32px), (max-width: 850px) calc((100vw - 48px) / 2), 401px" width="512" height="512" alt="Ejemplo de llavero personalizado: Celebraciones y eventos" loading="lazy">
          <figcaption>XV Años</figcaption>
        </figure>
        <figure class="item">
          <img src="images/celebracion_2.webp" alt="Boda" loading="lazy">
          <figcaption>Boda</figcaption>
        </figure>
        <figure class="item">
          <img src="images/celebracion_3.webp" alt="Cumpleaños" loading="lazy">
          <figcaption>Cumpleaños</figcaption>
        </figure>
        <figure class="item">
          <img src="images/celebracion_4.webp" alt="Graduación" loading="lazy">
          <figcaption>Graduación</figcaption>
        </figure>
        <figure class="item">
          <img src="images/celebracion_5.webp" alt="Aniversario (empresa)" loading="lazy">
          <figcaption>Aniversario (empresa)</figcaption>
        </figure>
        <figure class="item">
          <img src="images/celebracion_6.webp" alt="Feria / Evento" loading="lazy">
          <figcaption>Feria / Evento</figcaption>
        </figure>
      </div>
    </section>

    <section>
      <h2>Logotipos e isotipos</h2>
      <div class="grid">
        <figure class="item">
          <img src="images/logo_negocio_1.webp"
                 srcset="images/logo_negocio_1-192.webp 192w, images/logo_negocio_1-320.webp 320w, images/logo_negocio_1.webp 512w"
                 sizes="(max-width: 360px) calc(100vw - 32px), (max-width: 850px) calc((100vw - 48px) / 2), 401px" width="512" height="570" alt="Ejemplo de llavero personalizado: Logotipos e isotipos para negocios" loading="lazy">
          <figcaption>Engranaje</figcaption>
        </figure>
        <figure class="item">
          <img src="images/taller_2.webp" alt="Silueta de automóvil" loading="lazy">
          <figcaption>Silueta de automóvil</figcaption>
        </figure>
        <figure class="item">
          <img src="images/taller_3.webp" alt="Pistón y biela" loading="lazy">
          <figcaption>Pistón y biela</figcaption>
        </figure>
        <figure class="item">
          <img src="images/taller_4.webp" alt="Placa de taller" loading="lazy">
          <figcaption>Placa de taller</figcaption>
        </figure>
        <figure class="item">
          <img src="images/taller_5.webp" alt="Llave mecánica" loading="lazy">
          <figcaption>Llave mecánica</figcaption>
        </figure>
        <figure class="item">
          <img src="images/cafe_1.webp" alt="Taza de café" loading="lazy">
          <figcaption>Taza de café</figcaption>
        </figure>
        <figure class="item">
          <img src="images/cafe_2.webp" alt="Emblema circular" loading="lazy">
          <figcaption>Emblema circular</figcaption>
        </figure>
        <figure class="item">
          <img src="images/cafe_3.webp" alt="Café y postres" loading="lazy">
          <figcaption>Café y postres</figcaption>
        </figure>
        <figure class="item">
          <img src="images/cafe_4.webp" alt="Grano de café" loading="lazy">
          <figcaption>Grano de café</figcaption>
        </figure>
        <figure class="item">
          <img src="images/cafe_5.webp" alt="Cafetera italiana" loading="lazy">
          <figcaption>Cafetera italiana</figcaption>
        </figure>
        <figure class="item">
          <img src="images/cafe_6.webp" alt="Temático / Mascota" loading="lazy">
          <figcaption>Temático / Mascota</figcaption>
        </figure>
      </div>
    </section>

    <footer><a class="volver" href="index.html">← Volver al inicio</a></footer>
  </main>
</body>
</html>
